schema_version = "1.3"

[task]
name = "pare/gym-fm-02"
description = "Evaluate the installed NeMo Gym Workplace Assistant Carlos example with the selected Gym agent and retain a scored rollout."
keywords = ["pare", "nemo-gym", "product-use", "workplace-assistant"]

[[task.authors]]
name = "Maygol Kananizadeh"
email = "mkananizadeh@nvidia.com"

[metadata]
case_id = "GYM-FM-02"
product = "NeMo Gym"
product_version = "0.7.0"
lifecycle_phase = "use"
persona_id = "P3-Agent"
persona = "Agent Builder with no Post-Training Experience"
fixture_id = "gym-fm-02-installed"
fixture_revision = "upstream-1"

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 120.0

# The workflow judge uses these timing and connection settings.
[verifier.env]
VERIFIER_JUDGE_TIME_BUDGET_SEC = "80"
VERIFIER_JUDGE_FINAL_RESERVE_SEC = "15"
VERIFIER_JUDGE_API_KEY = "${NGC_INFERENCE_API_KEY}"
VERIFIER_JUDGE_BASE_URL = "https://inference-api.nvidia.com/v1"
VERIFIER_JUDGE_MODEL = "azure/openai/gpt-6.1-terra"
VERIFIER_JUDGE_REASONING_EFFORT = "high"
VERIFIER_JUDGE_MAX_EVIDENCE_CHARS = "300000"

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "public"

# Runtime settings reach the outer agent tools, reference solution and verifier.
[environment.env]
GYM_AGENT = "${GYM_AGENT:-codex_agent}"
GYM_MODEL = "${GYM_MODEL:-openai/openai/gpt-5.4-mini}"
OPENAI_BASE_URL = "https://inference-api.nvidia.com/v1"
OPENAI_API_KEY = "${NGC_INFERENCE_API_KEY}"

# Harbor's oracle runs solve.sh with runtime values, not embedded credentials.
# Coding-agent inference settings remain in the selected job configuration.
[solution.env]
OPENAI_BASE_URL = "https://inference-api.nvidia.com/v1"
OPENAI_API_KEY = "${NGC_INFERENCE_API_KEY}"
