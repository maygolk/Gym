# Outer model connection; the task's inner model connection is independent.
policy_model_name: openai/openai/gpt-6.1-sol
policy_base_url: https://inference-api.nvidia.com/v1
policy_api_key: ${oc.env:NGC_INFERENCE_API_KEY}
policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      is_responses_native: true
      uses_reasoning_parser: false
      return_token_id_information: false
codex_agent:
  responses_api_agents:
    codex_agent:
      timeout: 1800
      reasoning_effort: high
      model_server_forwards_reasoning_effort: true
      inherit_sandbox_environment: true
      sandbox_logs_dir: /logs/agent
      verify_after_agent_error: true

# FM01 container settings.
builds:
  tool: docker
harbor_environment_server:
  environment_servers:
    harbor:
      sandbox_provider_options:
        run_args: ["--privileged"]
